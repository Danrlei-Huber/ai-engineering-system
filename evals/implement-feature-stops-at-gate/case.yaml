schema_version: "1.1"
name: implement-feature-stops-at-gate
description: The pipeline produces a plan and stops at the human gate without editing code.
tags: [workflow]
runs: 3
context:
  scaffold_script: scaffold.sh
execution:
  max_turns: 40
  timeout_seconds: 900
  # Only the read-only tools are granted from here; Bash, Edit and Write come from
  # --allow-tools on the command line (see evals/README.md).
  allowed_tools: [Read, Glob, Grep, Skill, Agent, Bash, Edit, Write]
