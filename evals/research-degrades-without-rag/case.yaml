schema_version: "1.1"
name: research-degrades-without-rag
description: /research produces a grounded answer with degraded confidence when the RAG server is unavailable.
tags: [workflow]
runs: 3
context:
  scaffold_script: scaffold.sh
execution:
  max_turns: 20
  timeout_seconds: 600
  # Only the read-only tools are granted from here; Bash, Edit and Write come from
  # --allow-tools on the command line (see evals/README.md).
  allowed_tools: [Read, Glob, Grep, Skill, Agent]
