name: ci

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      ablation:
        description: "Eval arms: none (plugin only) or with-without (adds the no-plugin baseline and reports the delta)"
        type: choice
        options: [none, with-without]
        default: none
  schedule:
    - cron: "0 6 * * 1" # weekly evals, Monday 06:00 UTC

jobs:
  hooks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: sudo apt-get update && sudo apt-get install -y jq shellcheck
      - run: shellcheck hooks/scripts/*.sh hooks/tests/run.sh evals/*/scaffold.sh
      - run: bash hooks/tests/run.sh

  plugin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version: 22 }
      - run: npm install -g @anthropic-ai/claude-code@2.1.330
      - run: claude plugin validate . --strict

  rag:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: rag
          POSTGRES_PASSWORD: rag_local_only
          POSTGRES_DB: rag
        ports: ["5433:5432"]
        options: >-
          --health-cmd "pg_isready -U rag -d rag"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    defaults:
      run:
        working-directory: rag
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: rag/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run build
      - run: npm test
        env:
          RAG_RUN_INTEGRATION: "1"
          RAG_EMBED_PROVIDER: fake
          RAG_TEST_DATABASE_URL: postgres://rag:rag_local_only@localhost:5433/rag

  evals:
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
    runs-on: ubuntu-latest
    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version: 22 }
      - run: sudo apt-get update && sudo apt-get install -y jq bubblewrap socat
      - name: Require the API key
        run: |
          if [ -z "$ANTHROPIC_API_KEY" ]; then
            echo "::error::ANTHROPIC_API_KEY is not set as a repository secret, so the eval suite cannot authenticate (every run would fail with 'Not logged in'). Add it under Settings > Secrets and variables > Actions, then re-run this job."
            exit 1
          fi
      - run: npm install -g @anthropic-ai/claude-code@2.1.330
      # The weekly run adds the no-plugin baseline arm so the report carries the delta the plugin
      # makes; a manual dispatch defaults to the plugin arm only. Model and judge are pinned so a
      # model rollout is not read as a plugin regression; the cost ceiling bounds a runaway run.
      - run: >
          claude plugin eval . --scaffold --trust-plugin
          --ablation ${{ github.event.inputs.ablation || 'with-without' }}
          --threshold 0.8 --allow-tools Bash Write Edit
          --model claude-sonnet-5 --judge-model claude-haiku-5-5 --max-cost-usd 20
          --json results.json --no-publish
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: eval-results
          path: |
            results.json
            evals/results/**
