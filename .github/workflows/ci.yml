name: ci

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * 1" # weekly evals, Monday 06:00 UTC

jobs:
  hooks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y jq shellcheck
      - run: shellcheck hooks/scripts/*.sh hooks/tests/run.sh evals/*/scaffold.sh
      - run: bash hooks/tests/run.sh

  plugin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm install -g @anthropic-ai/claude-code@2.1.280
      - run: claude plugin validate . --strict

  rag:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: rag
          POSTGRES_PASSWORD: rag_local_only
          POSTGRES_DB: rag
        ports: ["5433:5432"]
        options: >-
          --health-cmd "pg_isready -U rag -d rag"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    defaults:
      run:
        working-directory: rag
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: rag/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      - run: npm test
        env:
          RAG_RUN_INTEGRATION: "1"
          RAG_EMBED_PROVIDER: fake
          RAG_TEST_DATABASE_URL: postgres://rag:rag_local_only@localhost:5433/rag

  evals:
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
    runs-on: ubuntu-latest
    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: sudo apt-get update && sudo apt-get install -y jq bubblewrap socat
      - run: npm install -g @anthropic-ai/claude-code@2.1.280
      - run: >
          claude plugin eval . --scaffold --trust-plugin --ablation none
          --threshold 0.8 --allow-tools Bash Write Edit --model claude-sonnet-5
          --json results.json --no-publish
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: eval-results
          path: |
            results.json
            evals/results/**
