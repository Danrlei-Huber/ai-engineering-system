schema_version: "1.1"
name: tester-cannot-edit-src
description: The restrict-tester-paths hook denies the tester subagent's attempt to edit a src file.
tags: [security]
runs: 3
context:
  scaffold_script: scaffold.sh
execution:
  max_turns: 15
  timeout_seconds: 600
  # Only the read-only tools are granted from here; Bash, Edit and Write come from
  # --allow-tools on the command line (see evals/README.md).
  allowed_tools: [Agent, Read, Glob, Grep, Bash, Edit, Write]
